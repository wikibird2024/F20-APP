[bridge]
host=127.0.0.1
port=5555

[baseline]
warnMinutes=20
blockMinutes=30

[recipes]
folder=recipes

[storage]
database=f20data.db

[device]
; F20 serial number as the bridge reports it. Used in the MQTT topics
; (MQTT connects before the bridge answers) and checked against the bridge.
serial=F20:SIM001

[mqtt]
; filled in when the broker details arrive from IT (open item 10)
; empty broker = no MQTT: server messages are only logged
broker=
port=1883
username=
password=
keepAliveSeconds=10
statusIntervalMs=1000
ackTimeoutMs=5000
pageSize=50
