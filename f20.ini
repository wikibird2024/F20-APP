[bridge]
host=127.0.0.1
port=5555
; reply timeout for short commands (status, recipe, baseline steps)
timeoutMs=15000
; reply timeout for acquire, analyze and save - much slower than a status
measureTimeoutMs=60000

[baseline]
; defaults for every recipe not listed in a [baselineProfile_*] section
; (spec 6.2: films < 1000 A need a baseline every 20-30 min)
warnMinutes=20
blockMinutes=30

; one section per group of recipes with the same limits. Names as in
; FILMeasure, quoted, comma separated; a subfolder is written with \\.
; Keys left out use the [baseline] defaults. A recipe listed in several
; sections uses the first section in name order (a warning is logged).
[baselineProfile_thick]
recipes="SiN thick"
warnMinutes=240
blockMinutes=480

[logs]
; daily log files older than this are deleted (0 = keep all)
keepDays=30

[recipes]
folder=recipes

[storage]
database=f20data.db

[device]
; F20 serial number as the bridge reports it. Used in the MQTT topics
; (MQTT connects before the bridge answers) and checked against the bridge.
serial=F20:SIM001

[mqtt]
; filled in when the broker details arrive from IT (open item 10)
; empty broker = no MQTT: server messages are only logged
broker=
port=1883
username=
password=
keepAliveSeconds=10
statusIntervalMs=1000
ackTimeoutMs=5000
pageSize=50
